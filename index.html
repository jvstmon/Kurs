<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b2a">
  <meta name="description" content="Testy dla kandydatów na instruktorów nauki jazdy">
  <title>Kurs instruktora — Testy</title>

  <!-- Biblioteka do odczytu plików Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --green: #173b2a;
      --green-light: #24583f;
      --cream: #f5f1e8;
      --white: #ffffff;
      --text: #202520;
      --muted: #69716b;
      --border: #d9ded9;
      --correct: #237a4b;
      --wrong: #b33a3a;
      --shadow: 0 10px 30px rgba(23, 59, 42, 0.10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--cream);
      color: var(--text);
    }

    button {
      font: inherit;
    }

    .app {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0 50px;
    }

    header {
      margin-bottom: 24px;
    }

    .brand {
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 6px 0 0;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.05;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(22px, 5vw, 38px);
    }

    .start-card {
      text-align: center;
    }

    .start-card p {
      color: var(--muted);
      line-height: 1.6;
      max-width: 620px;
      margin: 12px auto 28px;
    }

    .status {
      margin-top: 18px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #eef2ee;
      color: var(--muted);
      font-size: 14px;
    }

    .status.error {
      background: #faeaea;
      color: var(--wrong);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .progress {
      height: 7px;
      background: #e2e7e3;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--green);
      transition: width .25s ease;
    }

    .question-number {
      color: var(--green);
      font-weight: 800;
      margin-bottom: 10px;
    }

    .question {
      font-size: clamp(21px, 4vw, 29px);
      line-height: 1.3;
      font-weight: 700;
      margin: 0 0 25px;
    }

    .answers {
      display: grid;
      gap: 12px;
    }

    .answer {
      position: relative;
    }

    .answer input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .answer label {
      display: block;
      cursor: pointer;
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 17px 18px;
      line-height: 1.45;
      transition: .15s ease;
      background: white;
    }

    .answer label:hover {
      border-color: var(--green-light);
      background: #f8faf8;
    }

    .answer input:checked + label {
      border-color: var(--green);
      background: #edf4ef;
      box-shadow: inset 0 0 0 1px var(--green);
    }

    .answer-letter {
      display: inline-flex;
      width: 29px;
      height: 29px;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      border-radius: 50%;
      margin-right: 10px;
      font-weight: 800;
      color: var(--green);
      vertical-align: middle;
      flex: 0 0 auto;
    }

    .answer-text {
      vertical-align: middle;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 26px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 12px;
      padding: 13px 20px;
      cursor: pointer;
      font-weight: 800;
      transition: .15s ease;
    }

    .btn-primary {
      background: var(--green);
      color: white;
    }

    .btn-primary:hover {
      background: var(--green-light);
    }

    .btn-secondary {
      background: #e9edea;
      color: var(--green);
    }

    .btn:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .result {
      display: none;
      margin-top: 28px;
      border-top: 1px solid var(--border);
      padding-top: 26px;
    }

    .result.visible {
      display: block;
    }

    .result-title {
      font-size: 22px;
      font-weight: 900;
      margin-bottom: 16px;
    }

    .result-title.correct {
      color: var(--correct);
    }

    .result-title.wrong {
      color: var(--wrong);
    }

    .solution-list {
      display: grid;
      gap: 9px;
      margin-bottom: 22px;
    }

    .solution-item {
      padding: 13px 15px;
      border-radius: 11px;
      border: 1px solid var(--border);
      line-height: 1.45;
    }

    .solution-item.correct-answer {
      border-color: #9ac8ad;
      background: #edf7f0;
    }

    .info-box {
      margin-top: 15px;
      padding: 17px;
      border-radius: 13px;
      background: #f5f6f5;
    }

    .info-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em;
      font-weight: 900;
      color: var(--green);
      margin-bottom: 7px;
    }

    .info-content {
      line-height: 1.55;
      white-space: pre-line;
    }

    .image-box {
      display: none;
      margin-top: 18px;
    }

    .image-box.visible {
      display: block;
    }

    .image-box img {
      display: block;
      max-width: 100%;
      max-height: 420px;
      margin: 0 auto;
      border-radius: 12px;
    }

    .empty {
      color: var(--muted);
      text-align: center;
      padding: 30px 10px;
    }

    @media (max-width: 600px) {
      .app {
        width: min(100% - 18px, 900px);
        padding-top: 18px;
      }

      .card {
        padding: 20px 16px;
        border-radius: 15px;
      }

      .actions {
        flex-direction: column;
      }

      .actions .btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main class="app">

    <header>
      <div class="brand">Kurs instruktora</div>
      <h1>Testy</h1>
    </header>

    <!-- EKRAN STARTOWY -->
    <section id="startScreen" class="screen active">
      <div class="card start-card">
        <h2>Sprawdź swoją wiedzę</h2>
        <p>
          Pytania są pobierane z pliku <strong>Baza_danych.xlsx</strong>.
          Odpowiedź zostanie oceniona dopiero po zatwierdzeniu.
        </p>

        <button id="startButton" class="btn btn-primary">
          Rozpocznij test
        </button>

        <div id="loadStatus" class="status">
          Ładowanie bazy pytań…
        </div>
      </div>
    </section>

    <!-- EKRAN TESTU -->
    <section id="testScreen" class="screen">
      <div class="topbar">
        <span id="questionCounter">Pytanie 1</span>
        <span id="questionId"></span>
      </div>

      <div class="progress">
        <div id="progressFill" class="progress-fill"></div>
      </div>

      <div class="card">
        <div id="questionNumber" class="question-number"></div>
        <h2 id="questionText" class="question"></h2>

        <div id="answers" class="answers"></div>

        <div class="actions">
          <button id="confirmButton" class="btn btn-primary">
            Zatwierdź odpowiedź
          </button>
        </div>

        <!-- ROZWIĄZANIE POKAZUJE SIĘ DOPIERO PO ZATWIERDZENIU -->
        <div id="result" class="result">
          <div id="resultTitle" class="result-title"></div>

          <div id="solutionList" class="solution-list"></div>

          <div id="explanationBox" class="info-box">
            <div class="info-label">Wyjaśnienie</div>
            <div id="explanation" class="info-content"></div>
          </div>

          <div id="legalBox" class="info-box">
            <div class="info-label">Podstawa prawna</div>
            <div id="legalBasis" class="info-content"></div>
          </div>

          <div id="imageBox" class="image-box">
            <div class="info-label">Ilustracja</div>
            <img id="questionImage" src="" alt="Ilustracja do pytania">
          </div>

          <div class="actions">
            <button id="nextButton" class="btn btn-primary">
              Następne pytanie
            </button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <script>
    // ============================================================
    // KONFIGURACJA
    // ============================================================

    const EXCEL_FILE = "Baza_danych.xlsx";

    // Liczba pytań w jednym teście.
    // Na razie 20. Później możemy zrobić wybór użytkownika.
    const QUESTIONS_PER_TEST = 20;


    // ============================================================
    // ZMIENNE APLIKACJI
    // ============================================================

    let allQuestions = [];
    let testQuestions = [];
    let currentQuestionIndex = 0;
    let currentQuestion = null;
    let selectedAnswers = [];


    // ============================================================
    // ELEMENTY HTML
    // ============================================================

    const startScreen = document.getElementById("startScreen");
    const testScreen = document.getElementById("testScreen");

    const startButton = document.getElementById("startButton");
    const confirmButton = document.getElementById("confirmButton");
    const nextButton = document.getElementById("nextButton");

    const loadStatus = document.getElementById("loadStatus");

    const questionCounter = document.getElementById("questionCounter");
    const questionId = document.getElementById("questionId");
    const questionNumber = document.getElementById("questionNumber");
    const questionText = document.getElementById("questionText");
    const answersContainer = document.getElementById("answers");
    const progressFill = document.getElementById("progressFill");

    const result = document.getElementById("result");
    const resultTitle = document.getElementById("resultTitle");
    const solutionList = document.getElementById("solutionList");
    const explanation = document.getElementById("explanation");
    const legalBasis = document.getElementById("legalBasis");

    const imageBox = document.getElementById("imageBox");
    const questionImage = document.getElementById("questionImage");


    // ============================================================
    // START APLIKACJI
    // ============================================================

    document.addEventListener("DOMContentLoaded", loadExcelDatabase);

    startButton.addEventListener("click", startTest);
    confirmButton.addEventListener("click", confirmAnswer);
    nextButton.addEventListener("click", showNextQuestion);


    // ============================================================
    // WCZYTYWANIE EXCELA
    // ============================================================

    async function loadExcelDatabase() {
      try {
        const response = await fetch(EXCEL_FILE);

        if (!response.ok) {
          throw new Error(
            `Nie udało się znaleźć pliku ${EXCEL_FILE}.`
          );
        }

        const arrayBuffer = await response.arrayBuffer();

        const workbook = XLSX.read(arrayBuffer, {
          type: "array"
        });

        // Bierzemy pierwszy arkusz Excela.
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];

        // Zamieniamy wiersze Excela na obiekty JavaScript.
        const rows = XLSX.utils.sheet_to_json(worksheet, {
          defval: ""
        });

        allQuestions = rows
          .map(normalizeQuestion)
          .filter(question => question.question);

        if (allQuestions.length === 0) {
          throw new Error(
            "Excel został odczytany, ale nie znaleziono żadnych pytań."
          );
        }

        loadStatus.textContent =
          `Załadowano ${allQuestions.length} pytań.`;

        startButton.disabled = false;

      } catch (error) {
        console.error(error);

        loadStatus.textContent =
          `Błąd: ${error.message}`;

        loadStatus.classList.add("error");

        startButton.disabled = true;
      }
    }


    // ============================================================
    // NORMALIZACJA WIERSZA EXCELA
    // ============================================================

    function normalizeQuestion(row) {

      const correct = parseCorrectAnswers(row.POPRAWNE);

      return {
        id: String(row.ID ?? "").trim(),

        question: String(row.PYTANIE ?? "").trim(),

        answers: [
          String(row.ODPOWIEDZ_1 ?? "").trim(),
          String(row.ODPOWIEDZ_2 ?? "").trim(),
          String(row.ODPOWIEDZ_3 ?? "").trim()
        ],

        correctAnswers: correct,

        explanation:
          String(row.WYJAŚNIENIE ?? "").trim(),

        legalBasis:
          String(row.PODSTAWA_PRAWNA ?? "").trim(),

        image:
          String(row.OBRAZ ?? "").trim()
      };
    }


    // ============================================================
    // ODCZYT "POPRAWNE"
    //
    // Przykłady:
    // "1"       -> [0]
    // "1,3"     -> [0, 2]
    // "1, 2, 3" -> [0, 1, 2]
    // ============================================================

    function parseCorrectAnswers(value) {

      return String(value)
        .split(",")
        .map(item => parseInt(item.trim(), 10))
        .filter(number => number >= 1 && number <= 3)
        .map(number => number - 1);
    }


    // ============================================================
    // START TESTU
    // ============================================================

    function startTest() {

      if (!allQuestions.length) {
        return;
      }

      // Kopia bazy, żeby nie modyfikować oryginału.
      const pool = [...allQuestions];

      shuffle(pool);

      testQuestions = pool.slice(
        0,
        Math.min(QUESTIONS_PER_TEST, pool.length)
      );

      currentQuestionIndex = 0;

      startScreen.classList.remove("active");
      testScreen.classList.add("active");

      showQuestion();
    }


    // ============================================================
    // WYŚWIETLENIE PYTANIA
    // ============================================================

    function showQuestion() {

      currentQuestion =
        testQuestions[currentQuestionIndex];

      selectedAnswers = [];

      result.classList.remove("visible");

      confirmButton.disabled = false;

      questionCounter.textContent =
        `Pytanie ${currentQuestionIndex + 1} z ${testQuestions.length}`;

      questionId.textContent =
        currentQuestion.id
          ? `ID: ${currentQuestion.id}`
          : "";

      questionNumber.textContent =
        `Pytanie ${currentQuestionIndex + 1}`;

      questionText.textContent =
        currentQuestion.question;

      progressFill.style.width =
        `${((currentQuestionIndex + 1) / testQuestions.length) * 100}%`;

      renderAnswers();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    // ============================================================
    // WYŚWIETLENIE ODPOWIEDZI
    // ============================================================

    function renderAnswers() {

      answersContainer.innerHTML = "";

      currentQuestion.answers.forEach((answer, index) => {

        // Pomijamy pustą odpowiedź.
        if (!answer) {
          return;
        }

        const wrapper = document.createElement("div");
        wrapper.className = "answer";

        const input = document.createElement("input");

        // Checkbox pozwala obsługiwać zarówno:
        // - jedną poprawną odpowiedź
        // - kilka poprawnych odpowiedzi
        input.type = "checkbox";
        input.id = `answer-${index}`;
        input.value = index;

        input.addEventListener("change", handleAnswerSelection);

        const label = document.createElement("label");
        label.htmlFor = input.id;

        const letter = document.createElement("span");
        letter.className = "answer-letter";
        letter.textContent =
          String.fromCharCode(65 + index);

        const text = document.createElement("span");
        text.className = "answer-text";
        text.textContent = answer;

        label.appendChild(letter);
        label.appendChild(text);

        wrapper.appendChild(input);
        wrapper.appendChild(label);

        answersContainer.appendChild(wrapper);
      });
    }


    // ============================================================
    // ZAZNACZANIE ODPOWIEDZI
    // ============================================================

    function handleAnswerSelection(event) {

      const index =
        Number(event.target.value);

      if (event.target.checked) {

        selectedAnswers.push(index);

      } else {

        selectedAnswers =
          selectedAnswers.filter(
            answerIndex => answerIndex !== index
          );
      }

      selectedAnswers.sort((a, b) => a - b);
    }


    // ============================================================
    // ZATWIERDZENIE ODPOWIEDZI
    // ============================================================

    function confirmAnswer() {

      if (selectedAnswers.length === 0) {
        alert("Najpierw zaznacz odpowiedź.");
        return;
      }

      const correct =
        arraysEqual(
          selectedAnswers,
          currentQuestion.correctAnswers
        );

      showResult(correct);

      // Statystyki zapisujemy lokalnie.
      saveAnswerStatistic(
        currentQuestion.id,
        correct
      );

      confirmButton.disabled = true;
    }


    // ============================================================
    // POKAZANIE ROZWIĄZANIA
    // ============================================================

    function showResult(isCorrect) {

      result.classList.add("visible");

      resultTitle.textContent =
        isCorrect
          ? "✓ Poprawna odpowiedź"
          : "✕ Niepoprawna odpowiedź";

      resultTitle.className =
        `result-title ${isCorrect ? "correct" : "wrong"}`;

      solutionList.innerHTML = "";

      currentQuestion.answers.forEach(
        (answer, index) => {

          if (!answer) {
            return;
          }

          const item =
            document.createElement("div");

          item.className = "solution-item";

          if (
            currentQuestion.correctAnswers
              .includes(index)
          ) {
            item.classList.add("correct-answer");

            item.innerHTML =
              `<strong>✓ Prawidłowa:</strong> ${escapeHtml(answer)}`;
          } else {

            item.innerHTML =
              `<strong>Nieprawidłowa:</strong> ${escapeHtml(answer)}`;
          }

          solutionList.appendChild(item);
        }
      );

      explanation.textContent =
        currentQuestion.explanation ||
        "Brak wyjaśnienia w bazie.";

      legalBasis.textContent =
        currentQuestion.legalBasis ||
        "Brak podstawy prawnej w bazie.";

      showQuestionImage();

      result.scrollIntoView({
        behavior: "smooth",
        block: "start"
      });
    }


    // ============================================================
    // OBRAZ
    //
    // W Excelu OBRAZ może zawierać np.:
    // "obrazy/pytanie_001.jpg"
    //
    // Jeżeli pole jest puste, obraz się nie pojawia.
    // ============================================================

    function showQuestionImage() {

      const imagePath =
        currentQuestion.image;

      if (!imagePath) {
        imageBox.classList.remove("visible");
        questionImage.removeAttribute("src");
        return;
      }

      questionImage.src = imagePath;

      questionImage.onerror = () => {
        imageBox.classList.remove("visible");
      };

      questionImage.onload = () => {
        imageBox.classList.add("visible");
      };
    }


    // ============================================================
    // NASTĘPNE PYTANIE
    // ============================================================

    function showNextQuestion() {

      if (
        currentQuestionIndex <
        testQuestions.length - 1
      ) {

        currentQuestionIndex++;
        showQuestion();

      } else {

        // Na razie po zakończeniu wracamy na początek.
        // Później zrobimy osobny ekran wyniku testu.
        showTestFinished();
      }
    }


    // ============================================================
    // KONIEC TESTU
    // ============================================================

    function showTestFinished() {

      const solved =
        testQuestions.length;

      alert(
        `Test zakończony!\nRozwiązano ${solved} pytań.`
      );

      testScreen.classList.remove("active");
      startScreen.classList.add("active");
    }


    // ============================================================
    // STATYSTYKI — WERSJA 1
    //
    // Później wykorzystamy je do inteligentnego powtarzania
    // pytań, na które użytkownik odpowiada błędnie.
    // ============================================================

    function saveAnswerStatistic(id, isCorrect) {

      if (!id) {
        return;
      }

      const storageKey =
        "kurs_instruktora_statystyki";

      const statistics =
        JSON.parse(
          localStorage.getItem(storageKey) || "{}"
        );

      if (!statistics[id]) {

        statistics[id] = {
          solved: 0,
          correct: 0,
          wrong: 0,
          lastSolved: null,
          lastWrong: null
        };
      }

      statistics[id].solved++;

      if (isCorrect) {

        statistics[id].correct++;

      } else {

        statistics[id].wrong++;
        statistics[id].lastWrong =
          new Date().toISOString();
      }

      statistics[id].lastSolved =
        new Date().toISOString();

      localStorage.setItem(
        storageKey,
        JSON.stringify(statistics)
      );
    }


    // ============================================================
    // LOSOWANIE
    // ============================================================

    function shuffle(array) {

      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] =
          [array[j], array[i]];
      }

      return array;
    }


    // ============================================================
    // PORÓWNANIE TABLIC
    // ============================================================

    function arraysEqual(a, b) {

      if (a.length !== b.length) {
        return false;
      }

      return a.every(
        (value, index) =>
          value === b[index]
      );
    }


    // ============================================================
    // BEZPIECZNE WSTAWIANIE TEKSTU DO innerHTML
    // ============================================================

    function escapeHtml(text) {

      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
  </script>

</body>
</html>
