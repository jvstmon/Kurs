<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
"use strict";

/* =========================================================
   KONFIGURACJA
   ========================================================= */

const EXCEL_FILE = "Baza_danych.xlsx";

/*
 * Zmieniaj tę wartość po każdej większej zmianie pliku Excel,
 * jeśli przeglądarka uparcie pokazuje starą wersję.
 */
const CACHE_VERSION = "20260921-7";


/* =========================================================
   STAN APLIKACJI
   ========================================================= */

let questions = [];
let currentQuestion = null;
let currentQuestionIndex = 0;

let answeredCount = 0;
let correctCount = 0;

let questionOrder = [];


/* =========================================================
   ELEMENTY HTML
   ========================================================= */

const statusElement = document.getElementById("status");
const testArea = document.getElementById("testArea");

const questionNumberElement = document.getElementById("questionNumber");
const questionTextElement = document.getElementById("questionText");

const questionImageElement = document.getElementById("questionImage");

const answersElement = document.getElementById("answers");

const checkButton = document.getElementById("checkButton");
const nextButton = document.getElementById("nextButton");

const resultElement = document.getElementById("result");

const explanationPanel = document.getElementById("explanationPanel");
const explanationElement = document.getElementById("explanation");
const legalBasisTextElement = document.getElementById("legalBasisText");

const totalQuestionsElement = document.getElementById("totalQuestions");
const answeredQuestionsElement = document.getElementById("answeredQuestions");
const correctQuestionsElement = document.getElementById("correctQuestions");

const multiInfoElement = document.getElementById("multiInfo");


/* =========================================================
   NORMALIZACJA NAGŁÓWKÓW EXCELA
   ========================================================= */

function normalizeHeader(value) {
    return String(value ?? "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "_");
}


/* =========================================================
   ODCZYT POPRAWNOŚCI
   ========================================================= */

/*
 * Każda odpowiedź ma własną kolumnę:
 *
 * POPRAWNA_A
 * POPRAWNA_B
 * POPRAWNA_C
 *
 * Zalecane wartości:
 *
 * 1 = poprawna
 * 0 = niepoprawna
 *
 * Dodatkowo funkcja rozpoznaje:
 * TAK, TRUE, PRAWDA, X
 * NIE, FALSE, FAŁSZ
 *
 * Dzięki temu nawet przypadkowe wpisanie TAK/NIE
 * nie rozwali logiki.
 */

function isCorrectValue(value) {

    if (value === null || value === undefined) {
        return false;
    }

    const text = String(value)
        .trim()
        .toUpperCase();

    if (text === "1") return true;
    if (text === "TAK") return true;
    if (text === "TRUE") return true;
    if (text === "PRAWDA") return true;
    if (text === "X") return true;

    if (text === "0") return false;
    if (text === "NIE") return false;
    if (text === "FALSE") return false;
    if (text === "FAŁSZ") return false;
    if (text === "") return false;

    return false;
}


/* =========================================================
   WCZYTANIE POPRAWNYCH ODPOWIEDZI
   ========================================================= */

function getCorrectAnswers(row, headerIndex) {

    const correctAnswers = [];

    if (
        isCorrectValue(
            row[headerIndex["POPRAWNA_A"]]
        )
    ) {
        correctAnswers.push("A");
    }

    if (
        isCorrectValue(
            row[headerIndex["POPRAWNA_B"]]
        )
    ) {
        correctAnswers.push("B");
    }

    if (
        isCorrectValue(
            row[headerIndex["POPRAWNA_C"]]
        )
    ) {
        correctAnswers.push("C");
    }

    return correctAnswers;
}


/* =========================================================
   TASOWANIE
   ========================================================= */

function shuffle(array) {

    const result = [...array];

    for (let i = result.length - 1; i > 0; i--) {

        const j = Math.floor(
            Math.random() * (i + 1)
        );

        [
            result[i],
            result[j]
        ] = [
            result[j],
            result[i]
        ];
    }

    return result;
}


/* =========================================================
   POBRANIE DANYCH Z EXCELA
   ========================================================= */

async function loadQuestions() {

    try {

        statusElement.textContent =
            "Wczytywanie bazy pytań...";

        const response = await fetch(
            `${EXCEL_FILE}?v=${CACHE_VERSION}`,
            {
                cache: "no-store"
            }
        );

        if (!response.ok) {
            throw new Error(
                `Nie udało się pobrać pliku ${EXCEL_FILE}.`
            );
        }

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer, {
                type: "array"
            });

        if (!workbook.SheetNames.length) {
            throw new Error(
                "Plik Excel nie zawiera żadnego arkusza."
            );
        }

        const sheet =
            workbook.Sheets[
                workbook.SheetNames[0]
            ];

        const rawRows =
            XLSX.utils.sheet_to_json(
                sheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        if (!rawRows.length) {
            throw new Error(
                "Arkusz Excel jest pusty."
            );
        }

        const rawHeaders =
            rawRows[0];

        const headers =
            rawHeaders.map(normalizeHeader);

        const headerIndex = {};

        headers.forEach(
            (header, index) => {
                if (header) {
                    headerIndex[header] = index;
                }
            }
        );


        /* ---------------------------------------------
           SPRAWDZENIE WYMAGANYCH KOLUMN
           --------------------------------------------- */

        const requiredHeaders = [
            "ID",
            "PYTANIE",
            "ODPOWIEDZ_1",
            "ODPOWIEDZ_2",
            "ODPOWIEDZ_3",
            "POPRAWNA_A",
            "POPRAWNA_B",
            "POPRAWNA_C"
        ];

        const missingHeaders =
            requiredHeaders.filter(
                header =>
                    !(header in headerIndex)
            );

        if (missingHeaders.length) {

            throw new Error(
                "Brakuje wymaganych kolumn w Excelu: " +
                missingHeaders.join(", ")
            );
        }


        /* ---------------------------------------------
           BUDOWANIE BAZY PYTAŃ
           --------------------------------------------- */

        questions = [];

        for (let i = 1; i < rawRows.length; i++) {

            const row = rawRows[i];

            const questionText =
                String(
                    row[headerIndex["PYTANIE"]] ?? ""
                ).trim();

            if (!questionText) {
                continue;
            }

            const correctAnswers =
                getCorrectAnswers(
                    row,
                    headerIndex
                );

            const question = {

                id:
                    row[
                        headerIndex["ID"]
                    ],

                text:
                    questionText,

                answers: {

                    A:
                        String(
                            row[
                                headerIndex["ODPOWIEDZ_1"]
                            ] ?? ""
                        ).trim(),

                    B:
                        String(
                            row[
                                headerIndex["ODPOWIEDZ_2"]
                            ] ?? ""
                        ).trim(),

                    C:
                        String(
                            row[
                                headerIndex["ODPOWIEDZ_3"]
                            ] ?? ""
                        ).trim()
                },

                correctAnswers:
                    correctAnswers,

                explanation:
                    headerIndex["WYJAŚNIENIE"] !== undefined
                        ? String(
                            row[
                                headerIndex["WYJAŚNIENIE"]
                            ] ?? ""
                        ).trim()
                        : "",

                legalBasis:
                    headerIndex["PODSTAWA_PRAWNA"] !== undefined
                        ? String(
                            row[
                                headerIndex["PODSTAWA_PRAWNA"]
                            ] ?? ""
                        ).trim()
                        : "",

                image:
                    headerIndex["OBRAZ"] !== undefined
                        ? String(
                            row[
                                headerIndex["OBRAZ"]
                            ] ?? ""
                        ).trim()
                        : ""
            };


            /*
             * Jeżeli pytanie nie ma zaznaczonej
             * żadnej poprawnej odpowiedzi,
             * nie dodajemy go do testu.
             */
            if (
                question.correctAnswers.length === 0
            ) {
                console.warn(
                    "Pytanie bez poprawnej odpowiedzi:",
                    question.id,
                    question.text
                );

                continue;
            }

            questions.push(question);
        }


        if (!questions.length) {
            throw new Error(
                "Nie znaleziono żadnych prawidłowo zbudowanych pytań."
            );
        }


        /* ---------------------------------------------
           LOSOWA KOLEJNOŚĆ
           --------------------------------------------- */

        questionOrder =
            shuffle(
                questions.map(
                    (_, index) => index
                )
            );

        currentQuestionIndex = 0;


        /* ---------------------------------------------
           STATYSTYKI
           --------------------------------------------- */

        totalQuestionsElement.textContent =
            questions.length;

        answeredQuestionsElement.textContent =
            "0";

        correctQuestionsElement.textContent =
            "0";


        /* ---------------------------------------------
           URUCHOMIENIE TESTU
           --------------------------------------------- */

        statusElement.classList.add(
            "hidden"
        );

        testArea.classList.remove(
            "hidden"
        );

        showQuestion();


    } catch (error) {

        console.error(
            "Błąd podczas wczytywania:",
            error
        );

        statusElement.innerHTML = `
            <div class="error">
                <strong>Nie udało się wczytać bazy pytań.</strong>
                <br><br>
                ${escapeHtml(error.message)}
            </div>
        `;
    }
}


/* =========================================================
   WYŚWIETLENIE PYTANIA
   ========================================================= */

function showQuestion() {

    if (!questionOrder.length) {
        finishTest();
        return;
    }

    const realIndex =
        questionOrder[
            currentQuestionIndex
        ];

    currentQuestion =
        questions[realIndex];


    /* ---------------------------------------------
       NUMER PYTANIA
       --------------------------------------------- */

    questionNumberElement.textContent =
        `Pytanie ${currentQuestionIndex + 1} z ${questionOrder.length}`;


    /* ---------------------------------------------
       TREŚĆ
       --------------------------------------------- */

    questionTextElement.textContent =
        currentQuestion.text;


    /* ---------------------------------------------
       ODPOWIEDZI
       --------------------------------------------- */

    answersElement.innerHTML = "";


    const letters = [
        "A",
        "B",
        "C"
    ];


    letters.forEach(letter => {

        const answerText =
            currentQuestion.answers[letter];

        const label =
            document.createElement("label");

        label.className =
            "answer";

        label.dataset.letter =
            letter;


        const checkbox =
            document.createElement("input");

        checkbox.type =
            "checkbox";

        checkbox.value =
            letter;

        checkbox.dataset.letter =
            letter;


        const letterElement =
            document.createElement("span");

        letterElement.className =
            "answer-letter";

        letterElement.textContent =
            `${letter}.`;


        const textElement =
            document.createElement("span");

        textElement.className =
            "answer-text";

        textElement.textContent =
            answerText;


        label.appendChild(
            checkbox
        );

        label.appendChild(
            letterElement
        );

        label.appendChild(
            textElement
        );


        answersElement.appendChild(
            label
        );
    });


    /* ---------------------------------------------
       INFORMACJA O WIELU ODPOWIEDZIACH
       --------------------------------------------- */

    if (
        currentQuestion.correctAnswers.length > 1
    ) {

        multiInfoElement.textContent =
            "Uwaga: w tym pytaniu prawidłowych może być kilka odpowiedzi. Zaznacz wszystkie.";

    } else {

        multiInfoElement.textContent =
            "Zaznacz prawidłową odpowiedź.";
    }


    /* ---------------------------------------------
       OBRAZ
       --------------------------------------------- */

    if (currentQuestion.image) {

        questionImageElement.src =
            currentQuestion.image;

        questionImageElement.classList.remove(
            "hidden"
        );

        questionImageElement.onerror =
            function() {

                this.classList.add(
                    "hidden"
                );
            };

    } else {

        questionImageElement.src = "";

        questionImageElement.classList.add(
            "hidden"
        );
    }


    /* ---------------------------------------------
       RESET ODPOWIEDZI
       --------------------------------------------- */

    resultElement.style.display =
        "none";

    resultElement.className = "";

    resultElement.innerHTML = "";

    explanationPanel.style.display =
        "none";

    explanationElement.innerHTML =
        "";

    legalBasisTextElement.innerHTML =
        "";


    checkButton.disabled =
        false;

    nextButton.disabled =
        true;
}


/* =========================================================
   POBRANIE ZAZNACZONYCH ODPOWIEDZI
   ========================================================= */

function getSelectedAnswers() {

    const selected = [];

    const checkboxes =
        answersElement.querySelectorAll(
            'input[type="checkbox"]:checked'
        );

    checkboxes.forEach(
        checkbox => {

            selected.push(
                checkbox.value
            );
        }
    );

    return selected.sort();
}


/* =========================================================
   PORÓWNANIE ODPOWIEDZI
   ========================================================= */

function arraysEqual(a, b) {

    if (a.length !== b.length) {
        return false;
    }

    for (let i = 0; i < a.length; i++) {

        if (a[i] !== b[i]) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   SPRAWDZENIE ODPOWIEDZI
   ========================================================= */

function checkAnswer() {

    if (!currentQuestion) {
        return;
    }


    const selectedAnswers =
        getSelectedAnswers();

    const correctAnswers =
        [...currentQuestion.correctAnswers]
            .sort();


    /* ---------------------------------------------
       NIC NIE ZAZNACZONO
       --------------------------------------------- */

    if (!selectedAnswers.length) {

        resultElement.className =
            "incorrect-result";

        resultElement.style.display =
            "block";

        resultElement.innerHTML =
            "<strong>Zaznacz przynajmniej jedną odpowiedź.</strong>";

        return;
    }


    /* ---------------------------------------------
       SPRAWDZENIE
       --------------------------------------------- */

    const isCorrect =
        arraysEqual(
            selectedAnswers,
            correctAnswers
        );


    answeredCount++;

    if (isCorrect) {
        correctCount++;
    }


    answeredQuestionsElement.textContent =
        answeredCount;

    correctQuestionsElement.textContent =
        correctCount;


    /* ---------------------------------------------
       OZNACZENIE ODPOWIEDZI
       --------------------------------------------- */

    const answerLabels =
        answersElement.querySelectorAll(
            ".answer"
        );


    answerLabels.forEach(label => {

        const letter =
            label.dataset.letter;


        label.classList.remove(
            "correct",
            "incorrect",
            "missed"
        );


        const wasSelected =
            selectedAnswers.includes(
                letter
            );

        const isActuallyCorrect =
            correctAnswers.includes(
                letter
            );


        /*
         * Poprawna odpowiedź:
         * zielona niezależnie od tego,
         * czy użytkownik ją zaznaczył.
         */
        if (isActuallyCorrect) {

            label.classList.add(
                "correct"
            );
        }


        /*
         * Zaznaczona, ale błędna:
         * czerwona.
         */
        if (
            wasSelected &&
            !isActuallyCorrect
        ) {

            label.classList.remove(
                "correct"
            );

            label.classList.add(
                "incorrect"
            );
        }
    });


    /* ---------------------------------------------
       WYNIK
       --------------------------------------------- */

    if (isCorrect) {

        resultElement.className =
            "correct-result";

        resultElement.innerHTML =
            "<strong>✓ Poprawna odpowiedź!</strong>";

    } else {

        resultElement.className =
            "incorrect-result";

        resultElement.innerHTML =
            "<strong>✗ Niepoprawna odpowiedź.</strong>";
    }

    resultElement.style.display =
        "block";


    /* ---------------------------------------------
       WYJAŚNIENIE
       --------------------------------------------- */

    showExplanation();


    /* ---------------------------------------------
       BLOKADA DALSZEGO ZAZNACZANIA
       --------------------------------------------- */

    const inputs =
        answersElement.querySelectorAll(
            "input"
        );

    inputs.forEach(
        input => {
            input.disabled = true;
        }
    );


    checkButton.disabled =
        true;

    nextButton.disabled =
        false;
}


/* =========================================================
   WYJAŚNIENIE
   ========================================================= */

function showExplanation() {

    explanationPanel.style.display =
        "block";


    if (currentQuestion.explanation) {

        explanationElement.textContent =
            currentQuestion.explanation;

    } else {

        explanationElement.textContent =
            "Brak wyjaśnienia w bazie.";
    }


    if (currentQuestion.legalBasis) {

        legalBasisTextElement.textContent =
            currentQuestion.legalBasis;

    } else {

        legalBasisTextElement.textContent =
            "Brak podstawy prawnej w bazie.";
    }
}


/* =========================================================
   NASTĘPNE PYTANIE
   ========================================================= */

function nextQuestion() {

    currentQuestionIndex++;

    if (
        currentQuestionIndex >=
        questionOrder.length
    ) {

        finishTest();

        return;
    }

    showQuestion();
}


/* =========================================================
   KONIEC TESTU
   ========================================================= */

function finishTest() {

    currentQuestion = null;

    questionTextElement.textContent =
        "Koniec testu.";

    questionNumberElement.textContent =
        "";

    answersElement.innerHTML =
        "";

    questionImageElement.classList.add(
        "hidden"
    );

    multiInfoElement.textContent =
        "";

    checkButton.disabled =
        true;

    nextButton.disabled =
        true;

    resultElement.className =
        "correct-result";

    resultElement.style.display =
        "block";

    resultElement.innerHTML = `
        <strong>Test zakończony.</strong>
        <br><br>
        Wynik: ${correctCount} poprawnych
        z ${answeredCount} odpowiedzi.
    `;

    showExplanation();

    explanationElement.textContent =
        "Możesz odświeżyć stronę, aby rozpocząć nowy test.";

    legalBasisTextElement.textContent =
        "";
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   OBSŁUGA PRZYCISKÓW
   ========================================================= */

checkButton.addEventListener(
    "click",
    checkAnswer
);

nextButton.addEventListener(
    "click",
    nextQuestion
);


/* =========================================================
   START
   ========================================================= */

loadQuestions();

</script>
