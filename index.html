<body>

<div class="app">

    </div>

<script src="https://cdn.sheetjs.com/xlsx-0.18.5/package/dist/xlsx.full.min.js"></script>

<script>

  /*
   * ============================================================
   * KONFIGURACJA
   * ============================================================
   */

  const EXCEL_FILE =
    "Baza_danych.xlsx?v=20260921-1";


  /*
   * ============================================================
   * STAN APLIKACJI
   * ============================================================
   */

  let questions = [];

  let currentQuestionIndex = 0;

  let currentQuestion = null;

  let answered = false;

  let correctCount = 0;

  let incorrectCount = 0;


  /*
   * ============================================================
   * ELEMENTY HTML
   * ============================================================
   */

  const appContent =
    document.getElementById("appContent");

  const loading =
    document.getElementById("loading");

  const currentNumber =
    document.getElementById("currentNumber");

  const correctCountElement =
    document.getElementById("correctCount");

  const incorrectCountElement =
    document.getElementById("incorrectCount");

  const progressBar =
    document.getElementById("progressBar");


  /*
   * ============================================================
   * NORMALIZACJA NAZW KOLUMN
   * ============================================================
   *
   * Dzięki temu kolejność kolumn w Excelu może się zmienić.
   * Liczy się nazwa nagłówka.
   */

  function normalizeHeader(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .trim()
      .toUpperCase()
      .replace(/\s+/g, "_");

  }


  /*
   * ============================================================
   * WARTOŚĆ 0/1
   * ============================================================
   *
   * Główna baza używa:
   *
   * 1 = odpowiedź prawidłowa
   * 0 = odpowiedź nieprawidłowa
   *
   * Dodatkowo obsługujemy kilka bezpiecznych wariantów,
   * gdyby Excel zmienił sposób zapisania wartości.
   */

  function isCorrectFlag(value) {

    if (value === null || value === undefined) {
      return false;
    }

    const text =
      String(value)
        .trim()
        .toUpperCase();

    if (
      text === "1" ||
      text === "TRUE" ||
      text === "PRAWDA" ||
      text === "TAK" ||
      text === "YES" ||
      text === "X"
    ) {
      return true;
    }

    return false;
  }


  /*
   * ============================================================
   * POBIERANIE WARTOŚCI Z WIERSZA
   * ============================================================
   */

  function getCell(row, headerIndex, headerName) {

    const index =
      headerIndex[normalizeHeader(headerName)];

    if (
      index === undefined ||
      index === null
    ) {
      return "";
    }

    return row[index];

  }


  /*
   * ============================================================
   * WCZYTANIE EXCELA
   * ============================================================
   */

  async function loadQuestions() {

    try {

      const response =
        await fetch(EXCEL_FILE, {
          cache: "no-store"
        });

      if (!response.ok) {
        throw new Error(
          "Nie udało się pobrać pliku Baza_danych.xlsx. " +
          "Kod HTTP: " + response.status
        );
      }

      const arrayBuffer =
        await response.arrayBuffer();

      const workbook =
        XLSX.read(arrayBuffer, {
          type: "array"
        });

      if (
        !workbook.SheetNames ||
        workbook.SheetNames.length === 0
      ) {
        throw new Error(
          "Plik Excel nie zawiera żadnego arkusza."
        );
      }

      const sheetName =
        workbook.SheetNames[0];

      const worksheet =
        workbook.Sheets[sheetName];

      const rows =
        XLSX.utils.sheet_to_json(
          worksheet,
          {
            header: 1,
            defval: ""
          }
        );

      if (!rows.length) {
        throw new Error(
          "Arkusz Excel jest pusty."
        );
      }


      /*
       * --------------------------------------------------------
       * NAGŁÓWKI
       * --------------------------------------------------------
       */

      const rawHeaders =
        rows[0];

      const headerIndex = {};

      rawHeaders.forEach(
        (header, index) => {

          const normalized =
            normalizeHeader(header);

          if (normalized) {
            headerIndex[normalized] = index;
          }

        }
      );


      /*
       * --------------------------------------------------------
       * WYMAGANE KOLUMNY
       * --------------------------------------------------------
       */

      const requiredHeaders = [
        "ID",
        "PYTANIE",
        "ODPOWIEDZ_A",
        "ODPOWIEDZ_B",
        "ODPOWIEDZ_C",
        "POPRAWNA_A",
        "POPRAWNA_B",
        "POPRAWNA_C",
        "WYJAŚNIENIE",
        "PODSTAWA_PRAWNA",
        "OBRAZ"
      ];

      const missingHeaders =
        requiredHeaders.filter(
          header =>
            headerIndex[
              normalizeHeader(header)
            ] === undefined
        );


      if (missingHeaders.length > 0) {

        throw new Error(
          "Brakuje wymaganych kolumn w bazie:\n\n" +
          missingHeaders.join("\n") +
          "\n\n" +
          "Oczekiwane nagłówki to:\n" +
          requiredHeaders.join("\n")
        );

      }


      /*
       * --------------------------------------------------------
       * BUDOWANIE PYTAŃ
       * --------------------------------------------------------
       */

      const loadedQuestions = [];

      for (
        let rowNumber = 1;
        rowNumber < rows.length;
        rowNumber++
      ) {

        const row = rows[rowNumber];

        if (!row) {
          continue;
        }


        const id =
          getCell(
            row,
            headerIndex,
            "ID"
          );

        const questionText =
          getCell(
            row,
            headerIndex,
            "PYTANIE"
          );


        /*
         * Puste wiersze pomijamy.
         */

        if (
          questionText === null ||
          questionText === undefined ||
          String(questionText).trim() === ""
        ) {
          continue;
        }


        const answerA =
          getCell(
            row,
            headerIndex,
            "ODPOWIEDZ_A"
          );

        const answerB =
          getCell(
            row,
            headerIndex,
            "ODPOWIEDZ_B"
          );

        const answerC =
          getCell(
            row,
            headerIndex,
            "ODPOWIEDZ_C"
          );


        /*
         * ------------------------------------------------------
         * POPRAWNE ODPOWIEDZI
         * ------------------------------------------------------
         *
         * NIE MA TU JUŻ ŻADNEGO PARSOWANIA:
         *
         * POPRAWNE = 1/0
         *
         * A -> POPRAWNA_A
         * B -> POPRAWNA_B
         * C -> POPRAWNA_C
         *
         * Dzięki temu np.
         *
         * 0 | 1 | 1
         *
         * daje dokładnie:
         *
         * ["B", "C"]
         */

        const correctAnswers = [];


        const correctA =
          isCorrectFlag(
            getCell(
              row,
              headerIndex,
              "POPRAWNA_A"
            )
          );

        const correctB =
          isCorrectFlag(
            getCell(
              row,
              headerIndex,
              "POPRAWNA_B"
            )
          );

        const correctC =
          isCorrectFlag(
            getCell(
              row,
              headerIndex,
              "POPRAWNA_C"
            )
          );


        if (correctA) {
          correctAnswers.push("A");
        }

        if (correctB) {
          correctAnswers.push("B");
        }

        if (correctC) {
          correctAnswers.push("C");
        }


        /*
         * Jeżeli pytanie nie ma żadnej poprawnej odpowiedzi,
         * traktujemy bazę jako błędną.
         */

        if (correctAnswers.length === 0) {

          console.warn(
            "Pytanie bez poprawnej odpowiedzi:",
            id,
            questionText
          );

          continue;
        }


        /*
         * ------------------------------------------------------
         * WYJAŚNIENIE / PODSTAWA / OBRAZ
         * ------------------------------------------------------
         */

        const explanation =
          getCell(
            row,
            headerIndex,
            "WYJAŚNIENIE"
          );

        const legalBasis =
          getCell(
            row,
            headerIndex,
            "PODSTAWA_PRAWNA"
          );

        const image =
          getCell(
            row,
            headerIndex,
            "OBRAZ"
          );


        loadedQuestions.push({

          id:
            String(id).trim(),

          question:
            String(questionText).trim(),

          answers: {

            A:
              String(answerA ?? "").trim(),

            B:
              String(answerB ?? "").trim(),

            C:
              String(answerC ?? "").trim()

          },

          correctAnswers,

          explanation:
            String(explanation ?? "").trim(),

          legalBasis:
            String(legalBasis ?? "").trim(),

          image:
            String(image ?? "").trim()

        });

      }


      if (loadedQuestions.length === 0) {

        throw new Error(
          "Nie udało się wczytać żadnego pytania z bazy."
        );

      }


      /*
       * --------------------------------------------------------
       * LOSOWANIE PYTAŃ
       * --------------------------------------------------------
       */

      questions =
        shuffleArray(
          loadedQuestions
        );


      /*
       * --------------------------------------------------------
       * START
       * --------------------------------------------------------
       */

      currentQuestionIndex = 0;

      correctCount = 0;

      incorrectCount = 0;

      updateStats();

      renderQuestion();


    } catch (error) {

      console.error(
        "Błąd ładowania bazy:",
        error
      );

      showError(
        error.message ||
        "Wystąpił nieznany błąd podczas ładowania bazy."
      );

    }

  }


  /*
   * ============================================================
   * LOSOWANIE
   * ============================================================
   */

  function shuffleArray(array) {

    const result =
      [...array];

    for (
      let i = result.length - 1;
      i > 0;
      i--
    ) {

      const j =
        Math.floor(
          Math.random() * (i + 1)
        );

      [
        result[i],
        result[j]
      ] = [
        result[j],
        result[i]
      ];

    }

    return result;

  }


  /*
   * ============================================================
   * WYŚWIETLANIE PYTANIA
   * ============================================================
   */

  function renderQuestion() {

    if (
      !questions.length ||
      currentQuestionIndex >= questions.length
    ) {
      renderFinished();
      return;
    }


    currentQuestion =
      questions[
        currentQuestionIndex
      ];

    answered = false;


    currentNumber.textContent =
      currentQuestionIndex + 1;


    const percentage =
      (
        (
          currentQuestionIndex
          /
          questions.length
        ) * 100
      );

    progressBar.style.width =
      percentage + "%";


    const hasMultipleCorrect =
      currentQuestion.correctAnswers.length > 1;


    let html = `

      <div class="card">

        <div class="question-number">
          Pytanie ${currentQuestionIndex + 1}
          z ${questions.length}
        </div>

        <div class="question">
          ${escapeHtml(
            currentQuestion.question
          )}
        </div>
    `;


    /*
     * ----------------------------------------------------------
     * OBRAZ
     * ----------------------------------------------------------
     */

    if (currentQuestion.image) {

      html += `

        <div class="image-container">

          <img
            src="${escapeAttribute(
              currentQuestion.image
            )}"
            alt="Ilustracja do pytania"
            onerror="this.parentElement.style.display='none';"
          >

        </div>

      `;

    }


    /*
     * ----------------------------------------------------------
     * INFORMACJA O WIELU ODPOWIEDZIACH
     * ----------------------------------------------------------
     */

    if (hasMultipleCorrect) {

      html += `

        <div class="multi-info">
          To pytanie ma więcej niż jedną prawidłową odpowiedź.
          Zaznacz wszystkie, które uważasz za prawidłowe.
        </div>

      `;

    }


    /*
     * ----------------------------------------------------------
     * ODPOWIEDZI
     * ----------------------------------------------------------
     */

    html += `
      <div class="answers">
    `;


    const letters = [
      "A",
      "B",
      "C"
    ];


    letters.forEach(
      letter => {

        html += `

          <div class="answer">

            <input
              type="checkbox"
              id="answer_${letter}"
              value="${letter}"
              name="answer"
            >

            <label for="answer_${letter}">

              <span class="answer-letter">
                ${letter}
              </span>

              ${escapeHtml(
                currentQuestion.answers[letter]
              )}

            </label>

          </div>

        `;

      }
    );


    html += `
      </div>

      <div class="buttons">

        <button
          id="checkBtn"
          type="button"
          onclick="checkAnswer()"
        >
          Sprawdź odpowiedź
        </button>

        <button
          id="nextBtn"
          type="button"
          onclick="nextQuestion()"
          disabled
        >
          Następne pytanie
        </button>

      </div>

      <div
        id="result"
        class="result"
      ></div>

      <div
        id="explanation"
        class="explanation"
        style="display:none;"
      ></div>

      <div
        id="legalBasis"
        class="legal"
        style="display:none;"
      ></div>

      <div
        id="debug"
        class="debug"
      ></div>

    </div>
    `;


    appContent.innerHTML =
      html;

  }


  /*
   * ============================================================
   * POBRANIE ZAZNACZONYCH ODPOWIEDZI
   * ============================================================
   *
   * Zwracamy:
   *
   * ["A"]
   * ["B", "C"]
   * ["A", "B", "C"]
   *
   * Nigdy:
   *
   * [0]
   * [1]
   * [2]
   */

  function getSelectedAnswers() {

    const selected = [];

    const checkboxes =
      document.querySelectorAll(
        'input[name="answer"]:checked'
      );


    checkboxes.forEach(
      checkbox => {

        const value =
          checkbox.value;

        if (
          value === "A" ||
          value === "B" ||
          value === "C"
        ) {
          selected.push(value);
        }

      }
    );


    return selected.sort();

  }


  /*
   * ============================================================
   * SPRAWDZANIE ODPOWIEDZI
   * ============================================================
   */

  function checkAnswer() {

    if (
      answered ||
      !currentQuestion
    ) {
      return;
    }


    const selectedAnswers =
      getSelectedAnswers();


    /*
     * Nie pozwalamy sprawdzić pustej odpowiedzi.
     */

    if (selectedAnswers.length === 0) {

      const result =
        document.getElementById("result");

      result.className =
        "result bad";

      result.style.display =
        "block";

      result.innerHTML =
        "<strong>Zaznacz przynajmniej jedną odpowiedź.</strong>";

      return;
    }


    /*
     * ----------------------------------------------------------
     * SORTOWANIE OBU TABLIC
     * ----------------------------------------------------------
     */

    const correctAnswers =
      [
        ...currentQuestion.correctAnswers
      ].sort();


    const selectedSorted =
      [
        ...selectedAnswers
      ].sort();


    /*
     * ----------------------------------------------------------
     * PORÓWNANIE
     * ----------------------------------------------------------
     *
     * Odpowiedź jest poprawna tylko wtedy, gdy:
     *
     * liczba zaznaczonych = liczba poprawnych
     *
     * ORAZ
     *
     * każda zaznaczona odpowiedź znajduje się
     * wśród poprawnych.
     */

    const isCorrect =
      selectedSorted.length ===
      correctAnswers.length
      &&
      selectedSorted.every(
        (answer, index) =>
          answer ===
          correctAnswers[index]
      );


    answered = true;


    if (isCorrect) {

      correctCount++;

    } else {

      incorrectCount++;

    }


    updateStats();


    /*
     * ----------------------------------------------------------
     * BLOKOWANIE CHECKBOXÓW
     * ----------------------------------------------------------
     */

    const allCheckboxes =
      document.querySelectorAll(
        'input[name="answer"]'
      );


    allCheckboxes.forEach(
      checkbox => {

        checkbox.disabled =
          true;

      }
    );


    /*
     * ----------------------------------------------------------
     * OZNACZANIE ODPOWIEDZI
     * ----------------------------------------------------------
     */

    allCheckboxes.forEach(
      checkbox => {

        const letter =
          checkbox.value;

        const answerElement =
          checkbox.closest(
            ".answer"
          );

        if (!answerElement) {
          return;
        }


        /*
         * Odpowiedź prawidłowa:
         * zawsze pokazujemy ją na zielono.
         */

        if (
          correctAnswers.includes(
            letter
          )
        ) {

          if (
            selectedAnswers.includes(
              letter
            )
          ) {

            answerElement.classList.add(
              "correct"
            );

          } else {

            /*
             * Prawidłowa odpowiedź,
             * której użytkownik nie zaznaczył.
             */

            answerElement.classList.add(
              "missed"
            );

          }

        }


        /*
         * Odpowiedź zaznaczona,
         * ale nieprawidłowa.
         */

        if (
          selectedAnswers.includes(
            letter
          )
          &&
          !correctAnswers.includes(
            letter
          )
        ) {

          answerElement.classList.add(
            "incorrect"
          );

        }

        answerElement.classList.add(
          "disabled"
        );

      }
    );


    /*
     * ----------------------------------------------------------
     * WYNIK
     * ----------------------------------------------------------
     */

    const result =
      document.getElementById("result");


    if (isCorrect) {

      result.className =
        "result good";

      result.innerHTML =
        "<strong>✓ Poprawna odpowiedź</strong>";

    } else {

      result.className =
        "result bad";

      result.innerHTML =
        "<strong>✕ Niepoprawna odpowiedź</strong>" +
        "<br><br>" +
        buildAnswerSummary(
          selectedAnswers,
          correctAnswers
        );

    }


    result.style.display =
      "block";


    /*
     * ----------------------------------------------------------
     * WYJAŚNIENIE
     * ----------------------------------------------------------
     */

    const explanation =
      document.getElementById(
        "explanation"
      );


    if (
      currentQuestion.explanation
    ) {

      explanation.innerHTML =
        "<strong>Wyjaśnienie:</strong><br><br>" +
        formatText(
          currentQuestion.explanation
        );

      explanation.style.display =
        "block";

    }


    /*
     * ----------------------------------------------------------
     * PODSTAWA PRAWNA
     * ----------------------------------------------------------
     */

    const legalBasis =
      document.getElementById(
        "legalBasis"
      );


    if (
      currentQuestion.legalBasis
    ) {

      legalBasis.innerHTML =
        "<strong>Podstawa prawna:</strong><br><br>" +
        formatText(
          currentQuestion.legalBasis
        );

      legalBasis.style.display =
        "block";

    }


    /*
     * ----------------------------------------------------------
     * DEBUG — UKRYTY
     * ----------------------------------------------------------
     *
     * Zostawiam go w kodzie, ale użytkownik go nie widzi.
     * Przy ewentualnym kolejnym problemie można go łatwo
     * włączyć.
     */

    const debug =
      document.getElementById(
        "debug"
      );

    debug.textContent =
      "ID: " +
      currentQuestion.id +
      " | Poprawne: " +
      correctAnswers.join(", ") +
      " | Zaznaczone: " +
      selectedAnswers.join(", ");


    /*
     * ----------------------------------------------------------
     * PRZYCISK NASTĘPNEGO PYTANIA
     * ----------------------------------------------------------
     */

    document.getElementById(
      "checkBtn"
    ).disabled = true;

    document.getElementById(
      "nextBtn"
    ).disabled = false;

  }


  /*
   * ============================================================
   * PODSUMOWANIE ODPOWIEDZI
   * ============================================================
   */

  function buildAnswerSummary(
    selectedAnswers,
    correctAnswers
  ) {

    let html = "";


    /*
     * Najpierw pokazujemy błędnie zaznaczone.
     */

    selectedAnswers.forEach(
      letter => {

        if (
          !correctAnswers.includes(
            letter
          )
        ) {

          html +=
            "<strong>✕ Nieprawidłowa:</strong> " +
            escapeHtml(
              currentQuestion.answers[letter]
            ) +
            "<br>";

        }

      }
    );


    /*
     * Następnie wszystkie prawidłowe.
     */

    correctAnswers.forEach(
      letter => {

        html +=
          "<strong>✓ Prawidłowa:</strong> " +
          escapeHtml(
            currentQuestion.answers[letter]
          ) +
          "<br>";

      }
    );


    return html;

  }


  /*
   * ============================================================
   * NASTĘPNE PYTANIE
   * ============================================================
   */

  function nextQuestion() {

    if (!answered) {
      return;
    }


    currentQuestionIndex++;


    if (
      currentQuestionIndex >=
      questions.length
    ) {

      renderFinished();

      return;

    }


    renderQuestion();

  }


  /*
   * ============================================================
   * KONIEC TESTU
   * ============================================================
   */

  function renderFinished() {

    currentNumber.textContent =
      questions.length;

    progressBar.style.width =
      "100%";


    const total =
      correctCount +
      incorrectCount;


    const percentage =
      total > 0
        ? Math.round(
            (
              correctCount /
              total
            ) * 100
          )
        : 0;


    appContent.innerHTML = `

      <div class="card">

        <div class="question">
          Test zakończony
        </div>

        <p>
          <strong>Poprawne:</strong>
          ${correctCount}
        </p>

        <p>
          <strong>Błędne:</strong>
          ${incorrectCount}
        </p>

        <p>
          <strong>Wynik:</strong>
          ${percentage}%
        </p>

        <div class="buttons">

          <button
            type="button"
            id="restartBtn"
            onclick="restartTest()"
          >
            Rozpocznij ponownie
          </button>

        </div>

      </div>

    `;

  }


  /*
   * ============================================================
   * RESTART
   * ============================================================
   */

  function restartTest() {

    questions =
      shuffleArray(
        questions
      );

    currentQuestionIndex =
      0;

    currentQuestion =
      null;

    answered =
      false;

    correctCount =
      0;

    incorrectCount =
      0;

    updateStats();

    renderQuestion();

  }


  /*
   * ============================================================
   * STATYSTYKI
   * ============================================================
   */

  function updateStats() {

    correctCountElement.textContent =
      correctCount;

    incorrectCountElement.textContent =
      incorrectCount;

  }


  /*
   * ============================================================
   * BŁĄD
   * ============================================================
   */

  function showError(message) {

    loading.style.display =
      "none";


    appContent.innerHTML = `

      <div class="card">

        <div class="error">

          <strong>Nie udało się uruchomić testu.</strong>

          <br><br>

          ${escapeHtml(message)}

        </div>

      </div>

    `;

  }


  /*
   * ============================================================
   * FORMATOWANIE TEKSTU
   * ============================================================
   */

  function formatText(text) {

    return escapeHtml(
      String(text)
    )
    .replace(/\r\n/g, "\n")
    .replace(/\r/g, "\n")
    .replace(/\n/g, "<br>");

  }


  /*
   * ============================================================
   * BEZPIECZNE HTML
   * ============================================================
   */

  function escapeHtml(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function escapeAttribute(value) {

    return escapeHtml(value);

  }


  /*
   * ============================================================
   * START APLIKACJI
   * ============================================================
   */

  loadQuestions();


  /*
   * ============================================================
   * SERVICE WORKER
   * ============================================================
   */

  if (
    "serviceWorker" in navigator
  ) {

    window.addEventListener(
      "load",
      () => {

        navigator.serviceWorker
          .register(
            "service-worker.js"
          )
          .then(
            registration => {

              console.log(
                "Service Worker zarejestrowany:",
                registration.scope
              );

            }
          )
          .catch(
            error => {

              console.warn(
                "Nie udało się zarejestrować Service Workera:",
                error
              );

            }
          );

      }
    );

  }

</script>
