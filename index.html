<script>

"use strict";

/* =========================================================
   KONFIGURACJA
========================================================= */

const EXCEL_FILE = "Baza_danych.xlsx?v=20260921-5";

/*
    Odpowiedzi w całej aplikacji są reprezentowane WYŁĄCZNIE
    jako litery A / B / C.

    Nie ma tutaj:
    0 = A
    1 = B
    2 = C

    Excel:
    1     -> A
    2     -> B
    3     -> C
    1|2   -> A+B
    1|3   -> A+C
    2|3   -> B+C
    1|2|3 -> A+B+C
*/

const ANSWER_LETTERS = ["A", "B", "C"];


/* =========================================================
   STAN APLIKACJI
========================================================= */

let questions = [];
let currentQuestion = null;
let currentQuestionIndex = 0;

let answered = false;

let totalAnswered = Number(
    localStorage.getItem("instruktor_totalAnswered") || 0
);

let totalCorrect = Number(
    localStorage.getItem("instruktor_totalCorrect") || 0
);


/* =========================================================
   ELEMENTY DOM
========================================================= */

const loadingEl = document.getElementById("loading");
const errorEl = document.getElementById("error");
const quizEl = document.getElementById("quiz");

const questionNumberEl =
    document.getElementById("questionNumber");

const questionIdEl =
    document.getElementById("questionId");

const questionTextEl =
    document.getElementById("questionText");

const questionImageEl =
    document.getElementById("questionImage");

const answersEl =
    document.getElementById("answers");

const checkButton =
    document.getElementById("checkButton");

const nextButton =
    document.getElementById("nextButton");

const resultEl =
    document.getElementById("result");

const statTotal =
    document.getElementById("statTotal");

const statCorrect =
    document.getElementById("statCorrect");

const statPercent =
    document.getElementById("statPercent");


/* =========================================================
   STATYSTYKI
========================================================= */

function updateStats() {

    statTotal.textContent = totalAnswered;
    statCorrect.textContent = totalCorrect;

    const percent =
        totalAnswered > 0
            ? Math.round((totalCorrect / totalAnswered) * 100)
            : 0;

    statPercent.textContent = percent + "%";

    localStorage.setItem(
        "instruktor_totalAnswered",
        String(totalAnswered)
    );

    localStorage.setItem(
        "instruktor_totalCorrect",
        String(totalCorrect)
    );
}


/* =========================================================
   NAJWAŻNIEJSZA FUNKCJA:
   POPRAWNE ODPOWIEDZI Z EXCELA
========================================================= */

function parseCorrectAnswers(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return [];
    }

    const text = String(value)
        .trim()
        .replace(/\s+/g, "");

    /*
        KAŻDY MOŻLIWY PRZYPADEK JEST ROZPISANY OSOBNO.
    */

    if (text === "1") {
        return ["A"];
    }

    if (text === "2") {
        return ["B"];
    }

    if (text === "3") {
        return ["C"];
    }

    if (text === "1|2") {
        return ["A", "B"];
    }

    if (text === "1|3") {
        return ["A", "C"];
    }

    if (text === "2|3") {
        return ["B", "C"];
    }

    if (text === "1|2|3") {
        return ["A", "B", "C"];
    }

    /*
        Dodatkowo tolerujemy zapis z przecinkiem,
        średnikiem, ukośnikiem lub spacją.
    */

    const normalized =
        text.replace(/[,;/]+/g, "|");

    if (normalized === "1") {
        return ["A"];
    }

    if (normalized === "2") {
        return ["B"];
    }

    if (normalized === "3") {
        return ["C"];
    }

    if (normalized === "1|2") {
        return ["A", "B"];
    }

    if (normalized === "1|3") {
        return ["A", "C"];
    }

    if (normalized === "2|3") {
        return ["B", "C"];
    }

    if (normalized === "1|2|3") {
        return ["A", "B", "C"];
    }

    console.warn(
        "Nie rozpoznano wartości POPRAWNE:",
        value
    );

    return [];
}


/* =========================================================
   SORTOWANIE A/B/C
========================================================= */

function sortAnswers(answers) {

    const order = {
        "A": 1,
        "B": 2,
        "C": 3
    };

    return [...answers].sort(
        (a, b) => order[a] - order[b]
    );
}


/* =========================================================
   PORÓWNANIE ODPOWIEDZI
========================================================= */

function arraysEqual(a, b) {

    const first = sortAnswers(a);
    const second = sortAnswers(b);

    if (first.length !== second.length) {
        return false;
    }

    for (let i = 0; i < first.length; i++) {

        if (first[i] !== second[i]) {
            return false;
        }
    }

    return true;
}


/* =========================================================
   ODCZYT NAGŁÓWKÓW EXCELA
========================================================= */

function normalizeHeader(value) {

    return String(value ?? "")
        .trim()
        .toUpperCase();
}


/* =========================================================
   ŁADOWANIE EXCELA
========================================================= */

async function loadExcel() {

    try {

        loadingEl.classList.remove("hidden");
        errorEl.classList.add("hidden");
        quizEl.classList.add("hidden");

        const response =
            await fetch(EXCEL_FILE, {
                cache: "no-store"
            });

        if (!response.ok) {

            throw new Error(
                "Nie udało się pobrać pliku Baza_danych.xlsx. " +
                "Kod HTTP: " + response.status
            );
        }

        const arrayBuffer =
            await response.arrayBuffer();

        const workbook =
            XLSX.read(arrayBuffer, {
                type: "array"
            });

        if (
            !workbook.SheetNames ||
            workbook.SheetNames.length === 0
        ) {
            throw new Error(
                "Plik Excel nie zawiera arkusza."
            );
        }

        const sheetName =
            workbook.SheetNames[0];

        const worksheet =
            workbook.Sheets[sheetName];

        const rows =
            XLSX.utils.sheet_to_json(
                worksheet,
                {
                    header: 1,
                    defval: ""
                }
            );

        if (!rows.length) {

            throw new Error(
                "Arkusz Excel jest pusty."
            );
        }


        /* ---------------------------------------------
           NAGŁÓWKI
        --------------------------------------------- */

        const headers =
            rows[0].map(normalizeHeader);

        const headerIndex = {};

        headers.forEach(
            (header, index) => {

                if (header) {
                    headerIndex[header] = index;
                }
            }
        );


        const requiredHeaders = [
            "ID",
            "PYTANIE",
            "ODPOWIEDZ_1",
            "ODPOWIEDZ_2",
            "ODPOWIEDZ_3",
            "POPRAWNE"
        ];

        for (
            const header of requiredHeaders
        ) {

            if (
                headerIndex[header] === undefined
            ) {

                throw new Error(
                    "Brakuje kolumny w Excelu: " +
                    header
                );
            }
        }


        /* ---------------------------------------------
           PYTANIA
        --------------------------------------------- */

        questions = [];

        for (
            let rowNumber = 1;
            rowNumber < rows.length;
            rowNumber++
        ) {

            const row = rows[rowNumber];

            if (!row) {
                continue;
            }

            const id =
                row[headerIndex["ID"]];

            const questionText =
                row[headerIndex["PYTANIE"]];

            const answer1 =
                row[headerIndex["ODPOWIEDZ_1"]];

            const answer2 =
                row[headerIndex["ODPOWIEDZ_2"]];

            const answer3 =
                row[headerIndex["ODPOWIEDZ_3"]];

            const correctRaw =
                row[headerIndex["POPRAWNE"]];

            if (
                questionText === undefined ||
                String(questionText).trim() === ""
            ) {
                continue;
            }


            /*
                TUTAJ następuje jedyne przejście:

                Excel 1 -> A
                Excel 2 -> B
                Excel 3 -> C

                I potem aplikacja już pracuje
                WYŁĄCZNIE na A/B/C.
            */

            const correctAnswers =
                parseCorrectAnswers(correctRaw);


            const explanation =
                headerIndex["WYJAŚNIENIE"] !== undefined
                    ? row[headerIndex["WYJAŚNIENIE"]]
                    : "";

            const legalBasis =
                headerIndex["PODSTAWA_PRAWNA"] !== undefined
                    ? row[headerIndex["PODSTAWA_PRAWNA"]]
                    : "";

            const image =
                headerIndex["OBRAZ"] !== undefined
                    ? row[headerIndex["OBRAZ"]]
                    : "";


            questions.push({

                id: id,

                question:
                    String(questionText).trim(),

                answers: [
                    String(answer1 ?? "").trim(),
                    String(answer2 ?? "").trim(),
                    String(answer3 ?? "").trim()
                ],

                correctRaw:
                    String(correctRaw ?? "").trim(),

                correctAnswers:
                    correctAnswers,

                explanation:
                    String(explanation ?? "").trim(),

                legalBasis:
                    String(legalBasis ?? "").trim(),

                image:
                    String(image ?? "").trim()
            });
        }


        /* ---------------------------------------------
           DIAGNOSTYKA W KONSOLI
        --------------------------------------------- */

        console.table(
            questions.map(q => ({
                ID: q.id,
                POPRAWNE_W_EXCELU: q.correctRaw,
                POPRAWNE_W_PWA:
                    q.correctAnswers.join(", "),
                PYTANIE: q.question
            }))
        );


        if (questions.length === 0) {

            throw new Error(
                "Nie znaleziono żadnych pytań."
            );
        }


        /*
            Losowa kolejność pytań.
        */

        shuffleArray(questions);

        loadingEl.classList.add("hidden");
        quizEl.classList.remove("hidden");

        updateStats();
        showQuestion();

    } catch (error) {

        console.error(error);

        loadingEl.classList.add("hidden");

        errorEl.textContent =
            "Błąd podczas ładowania bazy pytań: " +
            error.message;

        errorEl.classList.remove("hidden");
    }
}


/* =========================================================
   LOSOWANIE
========================================================= */

function shuffleArray(array) {

    for (
        let i = array.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(
                Math.random() * (i + 1)
            );

        [
            array[i],
            array[j]
        ] = [
            array[j],
            array[i]
        ];
    }

    return array;
}


/* =========================================================
   POKAZANIE PYTANIA
========================================================= */

function showQuestion() {

    if (!questions.length) {
        return;
    }

    if (
        currentQuestionIndex >= questions.length
    ) {

        shuffleArray(questions);
        currentQuestionIndex = 0;
    }

    currentQuestion =
        questions[currentQuestionIndex];

    answered = false;


    questionNumberEl.textContent =
        "Pytanie " +
        (currentQuestionIndex + 1);


    questionIdEl.textContent =
        currentQuestion.id !== ""
            ? "ID: " + currentQuestion.id
            : "";


    questionTextEl.textContent =
        currentQuestion.question;


    /* ---------------------------------------------
       OBRAZ
    --------------------------------------------- */

    if (currentQuestion.image) {

        questionImageEl.src =
            currentQuestion.image;

        questionImageEl.classList.remove(
            "hidden"
        );

    } else {

        questionImageEl.removeAttribute("src");

        questionImageEl.classList.add(
            "hidden"
        );
    }


    /* ---------------------------------------------
       ODPOWIEDZI
    --------------------------------------------- */

    answersEl.innerHTML = "";

    currentQuestion.answers.forEach(
        (answerText, index) => {

            if (!answerText) {
                return;
            }

            const letter =
                ANSWER_LETTERS[index];


            const label =
                document.createElement("label");

            label.className =
                "answer";

            label.dataset.answer =
                letter;


            const checkbox =
                document.createElement("input");

            /*
                WAŻNE:

                To jest checkbox.
                Każda odpowiedź ma własny checkbox.
                Nie ma name="..." wspólnego z innymi.

                Dzięki temu można zaznaczyć:
                A
                B
                C
                A+B
                A+C
                B+C
                A+B+C
            */

            checkbox.type =
                "checkbox";

            checkbox.dataset.answer =
                letter;

            checkbox.id =
                "answer-" +
                currentQuestion.id +
                "-" +
                letter;


            const letterEl =
                document.createElement("span");

            letterEl.className =
                "answer-letter";

            letterEl.textContent =
                letter;


            const textEl =
                document.createElement("span");

            textEl.className =
                "answer-text";

            textEl.textContent =
                answerText;


            label.htmlFor =
                checkbox.id;


            label.appendChild(checkbox);
            label.appendChild(letterEl);
            label.appendChild(textEl);

            answersEl.appendChild(label);


            /*
                Kliknięcie w checkbox
                zaznacza również wizualnie cały blok.
            */

            checkbox.addEventListener(
                "change",
                () => {

                    if (answered) {
                        return;
                    }

                    label.classList.toggle(
                        "selected",
                        checkbox.checked
                    );
                }
            );
        }
    );


    /* ---------------------------------------------
       RESET WYNIKU
    --------------------------------------------- */

    resultEl.className =
        "result";

    resultEl.innerHTML =
        "";

    resultEl.style.display =
        "none";


    checkButton.classList.remove(
        "hidden"
    );

    checkButton.disabled =
        false;

    nextButton.classList.add(
        "hidden"
    );
}


/* =========================================================
   POBRANIE ZAZNACZONYCH ODPOWIEDZI
========================================================= */

function getSelectedAnswers() {

    const selected = [];

    const checked =
        answersEl.querySelectorAll(
            'input[type="checkbox"]:checked'
        );


    checked.forEach(
        input => {

            const answer =
                input.dataset.answer;

            /*
                Akceptujemy wyłącznie A/B/C.
            */

            if (
                answer === "A" ||
                answer === "B" ||
                answer === "C"
            ) {

                selected.push(answer);
            }
        }
    );


    return sortAnswers(
        [...new Set(selected)]
    );
}


/* =========================================================
   SPRAWDZANIE ODPOWIEDZI
========================================================= */

function checkAnswer() {

    if (
        answered ||
        !currentQuestion
    ) {
        return;
    }


    const selected =
        getSelectedAnswers();


    const correct =
        sortAnswers(
            currentQuestion.correctAnswers
        );


    /*
        DEBUG — pokazuje dokładnie:

        co było w Excelu,
        co PWA uznało za poprawne,
        co użytkownik zaznaczył.
    */

    console.log(
        "================================"
    );

    console.log(
        "SPRAWDZANIE PYTANIA"
    );

    console.log({
        ID: currentQuestion.id,

        POPRAWNE_W_EXCELU:
            currentQuestion.correctRaw,

        POPRAWNE_W_PWA:
            correct,

        ZAZNACZONE:
            selected
    });

    console.log(
        "================================"
    );


    const isCorrect =
        arraysEqual(
            selected,
            correct
        );


    answered = true;

    totalAnswered++;


    if (isCorrect) {
        totalCorrect++;
    }


    updateStats();


    /* ---------------------------------------------
       KOLOROWANIE ODPOWIEDZI
    --------------------------------------------- */

    const answerLabels =
        answersEl.querySelectorAll(
            ".answer"
        );


    answerLabels.forEach(
        label => {

            const answer =
                label.dataset.answer;

            const checkbox =
                label.querySelector(
                    'input[type="checkbox"]'
                );


            const wasSelected =
                selected.includes(answer);

            const isCorrectAnswer =
                correct.includes(answer);


            label.classList.remove(
                "selected"
            );


            if (isCorrectAnswer) {

                label.classList.add(
                    "correct"
                );
            }


            if (
                wasSelected &&
                !isCorrectAnswer
            ) {

                label.classList.add(
                    "incorrect"
                );
            }


            checkbox.disabled =
                true;
        }
    );


    /* ---------------------------------------------
       KOMUNIKAT
    --------------------------------------------- */

    const selectedText =
        selected.length
            ? selected.join(", ")
            : "brak";


    const correctText =
        correct.length
            ? correct.join(", ")
            : "brak";


    if (isCorrect) {

        resultEl.className =
            "result good";

        resultEl.innerHTML =
            "<strong>✓ Poprawnie!</strong>" +
            "<div>" +
            "Zaznaczone: <strong>" +
            selectedText +
            "</strong>" +
            "</div>";

    } else {

        resultEl.className =
            "result bad";

        resultEl.innerHTML =
            "<strong>✗ Niepoprawnie.</strong>" +
            "<div>" +
            "Zaznaczone: <strong>" +
            selectedText +
            "</strong>" +
            "</div>" +
            "<div>" +
            "Prawidłowe: <strong>" +
            correctText +
            "</strong>" +
            "</div>";
    }


    /* ---------------------------------------------
       WYJAŚNIENIE
    --------------------------------------------- */

    if (
        currentQuestion.explanation
    ) {

        const explanation =
            document.createElement("div");

        explanation.className =
            "explanation";

        explanation.innerHTML =
            "<strong>Wyjaśnienie:</strong><br>" +
            escapeHtml(
                currentQuestion.explanation
            );

        resultEl.appendChild(
            explanation
        );
    }


    /* ---------------------------------------------
       PODSTAWA PRAWNA
    --------------------------------------------- */

    if (
        currentQuestion.legalBasis
    ) {

        const legal =
            document.createElement("div");

        legal.className =
            "legal";

        legal.innerHTML =
            "<strong>Podstawa prawna:</strong> " +
            escapeHtml(
                currentQuestion.legalBasis
            );

        resultEl.appendChild(
            legal
        );
    }


    resultEl.style.display =
        "block";


    checkButton.classList.add(
        "hidden"
    );

    nextButton.classList.remove(
        "hidden"
    );
}


/* =========================================================
   NASTĘPNE PYTANIE
========================================================= */

function nextQuestion() {

    currentQuestionIndex++;

    showQuestion();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   PRZYCISKI
========================================================= */

checkButton.addEventListener(
    "click",
    checkAnswer
);

nextButton.addEventListener(
    "click",
    nextQuestion
);


/* =========================================================
   START
========================================================= */

updateStats();

loadExcel();

</script>
